# Publicación en Netlify: la landing del evento queda como página principal.
[build]
  command = "sh scripts/build-static.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/after"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
